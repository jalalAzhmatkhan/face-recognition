[project]
name = "ai-training"
version = "0.1.0"
description = "Face Recognition Access Control - training pipeline (data engineering, EDA, embedding, fine-tuning, evaluation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Heavy/infra deps: declared here, installed on demand (`uv sync --extra ml`).
# All imports of these packages in src/ are lazy so the pipeline skeleton,
# smoke tests, and CI stay green without them.
ml = [
    "torch>=2.2",
    "mlflow>=2.14",
    "boto3>=1.34",
    "numpy>=1.26",
]

[project.scripts]
ai-training = "ai_training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
