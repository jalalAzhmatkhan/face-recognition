[project]
name = "ai-training"
version = "0.1.0"
description = "Face Recognition Access Control - training pipeline (data engineering, EDA, embedding, fine-tuning, evaluation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # numpy is a BASE dependency (not under the `ml` extra) because TR-02's
    # quality metrics (ai_training/quality/metrics.py: blur/brightness/face
    # ratio) and the pure-geometry pieces of pose-bin mapping and face
    # alignment are implemented with plain numpy array math (manual 2D
    # convolution etc.) precisely so they stay unit-testable without
    # installing opencv/mediapipe/torch. It is small and pure-Python-wheel
    # friendly, unlike the rest of the `ml` extra.
    "numpy>=1.26",
    # The Celery task + raw-SQL DB modules (ai_training/worker/,
    # ai_training/db/) are TR-02/TR-03's real (non-stub) worker plumbing,
    # and its idempotency logic is required to be unit-testable (mocked
    # cursor, no real Postgres/Redis) without installing the heavy
    # detection/embedding stack. None of these three are "heavy" the way
    # torch/mediapipe are (pure-Python or small compiled wheels, fast
    # install) so — unlike opencv/mediapipe below — they are base deps,
    # not part of the `ml` extra.
    "celery>=5.3",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]

[project.optional-dependencies]
# Heavy/infra deps: declared here, installed on demand (`uv sync --extra ml`).
# All imports of these packages in src/ are lazy so the pipeline skeleton,
# smoke tests, and CI stay green without them.
ml = [
    "torch>=2.2",
    "mlflow>=2.14",
    "boto3>=1.34",
    # Face detection + landmarks for TR-02/TR-03 (video decode, pose
    # estimation, alignment). Chosen over downloading a standalone
    # detector weight file (e.g. SCRFD, or OpenCV's YuNet .onnx) because
    # SCRFD/AdaFace/MiniFASNet weights are explicitly NOT to be downloaded
    # for this task (separate licensing/procurement decision, see
    # documentation/research/recommendations.md). `opencv-python-headless`
    # (no GUI bindings, lighter than `opencv-python`) provides VideoCapture
    # decode + image ops; `mediapipe`'s legacy `mp.solutions.face_mesh` /
    # `face_detection` APIs ship their .tflite model assets INSIDE the pip
    # wheel itself (no separate runtime download/procurement step, unlike
    # SCRFD/AdaFace/MiniFASNet), and give real 3D-ish landmarks usable with
    # `cv2.solvePnP` for yaw/pitch head-pose estimation.
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10",
]

[project.scripts]
ai-training = "ai_training.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
