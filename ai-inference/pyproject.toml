[project]
name = "ai-inference"
version = "0.1.0"
description = "Face Recognition Access Control - inference service (detection -> alignment -> liveness -> embedding -> decision)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Heavy runtime deps: declared here, installed on demand (`uv sync --extra ml`).
# All imports of these packages in src/ are lazy so the service skeleton,
# smoke tests, and CI stay green without them.
ml = [
    "torch>=2.2",
    "mlflow>=2.14",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
