[project]
name = "ai-inference"
version = "0.1.0"
description = "Face Recognition Access Control - inference service (detection -> alignment -> liveness -> embedding -> decision)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Device bearer-token auth for /recognize (IN-02, NFR-SEC-04): pure-Python
    # Argon2id crypto, not ML -- lives in base deps (not the `ml` extra) so
    # device auth works and is unit-testable without the heavy extra
    # installed. See ai_inference/device_auth.py module docstring.
    "argon2-cffi>=23.1",
    # Outbound HTTP client for reporting access events to backend's own
    # `POST /access-events` (IN-06, TSD SS1.3) -- lives in base deps (not the
    # `ml` extra) since it's plain networking, not ML, and event emission
    # must work even in a `stub`-loader dev/CI setup. See ai_inference/events.py.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy runtime deps: declared here, installed on demand (`uv sync --extra ml`).
# All imports of these packages in src/ are lazy so the service skeleton,
# smoke tests, and CI stay green without them.
#
# IN-03 decision: ai-inference does NOT duplicate ai-training's detection/
# alignment/embedding code. It depends on `ai-training` itself as a `uv`
# **path dependency** (see `[tool.uv.sources]` below) for the already-live
# `ai_training.embedding.*` / `ai_training.quality.pose` pipeline. That
# dependency (with ai-training's own heavy `ml` extra active, which pulls in
# torch/opencv-python-headless/mediapipe/psycopg[binary]/pgvector/boto3/etc
# transitively) is listed HERE, under ai-inference's own `ml` extra, not in
# `[project.dependencies]` above — so a base `uv sync` (no extras) never
# needs it, keeping the service skeleton + smoke tests + base CI as light as
# they are today.
ml = [
    "torch>=2.2",
    "mlflow>=2.14",
    "onnxruntime>=1.18",
    "ai-training[ml]",
]
# OTel tracing is fully optional/lazy (src/ai_inference/tracing.py): the
# service stays runnable in dev/CI without a collector or these packages.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    # httpx itself is now a base runtime dep (IN-06, see [project.dependencies]
    # above) -- kept listed here implicitly via that; this group only needs
    # pytest/ruff plus whatever FastAPI's TestClient pulls in transitively.
    "ruff>=0.5",
]

[tool.uv.sources]
# Path dependency onto the sibling ai-training package (editable, monorepo-
# local — never published to a package index). See the `ml` extra comment
# above for why this lives under an optional extra rather than base deps.
ai-training = { path = "../ai-training", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `Depends(...)` as a parameter default is the framework's own
# idiom (evaluated once per-request by Starlette's DI, not at import time) --
# B008 exists for the general "don't call functions in defaults" footgun and
# doesn't special-case this, so silence it where Depends is used (same
# per-file-ignore backend/pyproject.toml uses for its own dependencies/routers).
"src/ai_inference/auth_dependency.py" = ["B008"]
"src/ai_inference/main.py" = ["B008"]
