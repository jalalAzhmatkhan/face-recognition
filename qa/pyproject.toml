[project]
name = "frac-qa"
version = "0.1.0"
description = "QA harness for Face Recognition Access Control (pytest + Playwright + httpx)"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: test membutuhkan service yang sedang berjalan (backend/frontend/inference); di-skip by default. Jalankan dengan: uv run pytest -m live",
    "api: API contract tests",
    "e2e: end-to-end browser tests (Playwright)",
    "security: security/privacy tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
