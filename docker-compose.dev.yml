# Docker Compose — development environment.
#
# XC-01 laid the app-service skeleton (backend/frontend/ai-inference/ai-training,
# profile "app" — opt-in). All four now have real Dockerfiles (see
# backend/Dockerfile, frontend/Dockerfile, ai-inference/Dockerfile,
# ai-training/Dockerfile) — `docker compose --profile app up` brings up the
# whole stack. `ai-inference`/`ai-training` install the full `ml` extra
# (torch/mediapipe/opencv/mlflow/...) so their first build is large and
# slow; no GPU passthrough is configured (CPU-only) — see those two
# Dockerfiles' own comments for why, and for the one manual step needed
# after first boot (downloading the AdaFace checkpoint).
# XC-02 adds the infra services below (default profile — `docker compose up`
# brings these up without needing `--profile app`): PostgreSQL 16 + pgvector,
# Redis 7, MinIO (S3-compatible, dev-only), MLflow (self-hosted).
#
# MLflow artifact store decision (dev): MinIO, not a bare local path.
#   - TSD SS3 mandates AWS S3 (real S3 in staging/prod) and the project rule
#     "media tidak boleh disimpan lokal" extends in spirit to MLflow artifacts.
#   - ai-training's `S3Settings.endpoint_url` already documents "override for
#     localstack/minio in dev" (see ai-training/src/ai_training/config.py),
#     so MinIO keeps dev, CI, and prod on the same S3 API/boto3 code path
#     instead of branching MLflow onto a local filesystem store.
#   - Trade-off: one more container in dev vs. a plain volume; accepted
#     because it removes a whole "works on filesystem, breaks on S3" class
#     of bugs before it reaches staging.
#
# Config via env vars — copy `.env.example` (root) to `.env` and adjust.
# JANGAN commit `.env` atau secret apa pun (nilai di sini hanyalah default dev).

name: face-recognition-dev

services:
  # One-shot: applies alembic migrations before `backend`/`celery-worker`
  # start, mirroring `minio-init`'s one-shot pattern below. Kept as its OWN
  # service (not baked into backend's entrypoint) so two containers never
  # race running `alembic upgrade head` concurrently against the same DB.
  backend-migrate:
    build:
      context: ./backend
    # No `uv` binary in the image's runtime stage (multi-stage build keeps
    # it builder-only, see backend/Dockerfile) -- `alembic` is on PATH via
    # the venv directly.
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frac}:${POSTGRES_PASSWORD:-frac_dev_password}@postgres:5432/${POSTGRES_DB:-frac}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["app"]

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frac}:${POSTGRES_PASSWORD:-frac_dev_password}@postgres:5432/${POSTGRES_DB:-frac}
      REDIS_URL: redis://redis:6379/0
      # Frontend runs in the BROWSER (not server-side), so it reaches this
      # container via the host-mapped port, not the `frontend` service's
      # Docker-internal DNS name — this must match wherever the frontend is
      # actually opened from (override via .env if not localhost).
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}
      # AWS S3 (XC-03): bucket provisioned manually by a human — see
      # infra/terraform/README.md. Left as .env-driven pass-through here
      # (no dev default bucket/creds baked into compose).
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-face-recognition/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Forgot-password email (BE-03 follow-up): MailHog accepts any message
      # without real delivery -- view what was "sent" at http://localhost:8025.
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      # Frontend runs in the BROWSER, so the reset-password link embedded in
      # the email must use the host-mapped origin, same reasoning as
      # CORS_ALLOW_ORIGINS above.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
    volumes:
      # Bind-mount for live reload (uvicorn --reload picks up host edits
      # without a rebuild); the anonymous volume on .venv stops the host's
      # (Windows-native, container-incompatible) virtualenv from shadowing
      # the Linux one built into the image.
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      backend-migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  # BE-07: Celery worker consuming async enrollment-processing jobs (QC job
  # today; TR-02 replaces the QC task body without touching this service).
  # Same image as `backend` (same code, same deps) — just a different
  # container command, per NFR-OPS-02 (async/retryable jobs).
  celery-worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    environment:
      APP_ENV: dev
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-frac}:${POSTGRES_PASSWORD:-frac_dev_password}@postgres:5432/${POSTGRES_DB:-frac}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Browser-side origin for the backend — see the matching note on
      # `backend`'s CORS_ALLOW_ORIGINS above (same host-mapped-port reasoning).
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      # Found live: on Windows/WSL2, host edits to the bind-mounted source
      # below don't reliably trigger Vite's file watcher (inotify events
      # from a Windows-host bind mount aren't forwarded into the Linux
      # container), so HMR silently stops picking up changes. This flips
      # Vite onto polling instead -- see vite.config.ts's matching comment.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    profiles: ["app"]

  ai-inference:
    build:
      # Root context, not ./ai-inference -- this service's `ml` extra path-
      # depends on the sibling ai-training/ tree. See ai-inference/Dockerfile's
      # own comment for the full explanation.
      context: .
      dockerfile: ai-inference/Dockerfile
    # 8100 matches Settings.port's own default (ai_inference/config.py) --
    # the previous "8001:8001" here predated any Dockerfile/CMD actually
    # binding a port and didn't match what the app binds; fixed while wiring
    # this up for real.
    ports:
      - "8100:8100"
    environment:
      APP_ENV: dev
      INF_MLFLOW_TRACKING_URI: http://mlflow:5000
      # Real AdaFace+MiniFASNet pipeline, not the stub loader -- requires the
      # `ml` extra (this image has it) AND the AdaFace checkpoint to have
      # been downloaded once (see ai-training/Dockerfile's comment); until
      # then `/recognize` fails closed with an actionable 500, per its own
      # "requires a real embedder" guard.
      INF_MODEL_LOADER: adaface
      # ai-inference is a server-side caller here (unlike the frontend/
      # browser case above), so it CAN use Docker-internal DNS for both of
      # these rather than a host-mapped port.
      INF_DB_DSN: postgresql://${POSTGRES_USER:-frac}:${POSTGRES_PASSWORD:-frac_dev_password}@postgres:5432/${POSTGRES_DB:-frac}
      INF_BACKEND_BASE_URL: http://backend:8000
    volumes:
      # Both source trees, kept as siblings under /app (same layout as the
      # image build) so the `../ai-training` editable path dependency keeps
      # resolving correctly, and edits to EITHER take effect via --reload.
      - ./ai-inference:/app/ai-inference
      - ./ai-training:/app/ai-training
      - ai_inference_venv:/app/ai-inference/.venv
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    profiles: ["app"]

  ai-training:
    build:
      context: ./ai-training
    environment:
      APP_ENV: dev
      TRN_DB__DSN: postgresql://${POSTGRES_USER:-frac}:${POSTGRES_PASSWORD:-frac_dev_password}@postgres:5432/${POSTGRES_DB:-frac}
      # Flat env var (no `__` nesting) -- MUST match backend's own REDIS_URL
      # (same broker/queue, cross-service task dispatch by name) -- found
      # live: this was missing entirely, so the worker kept retrying
      # `localhost:6379` (its no-Redis-configured default) forever.
      TRN_REDIS_URL: redis://redis:6379/0
      TRN_MLFLOW__TRACKING_URI: http://mlflow:5000
      TRN_S3__BUCKET: ${S3_BUCKET:-frac-media}
      TRN_S3__ENDPOINT_URL: http://minio:9000
      TRN_S3__REGION: ${AWS_REGION:-ap-southeast-1}
      # Real AdaFace/MiniFASNet backends, not the stub defaults -- MiniFASNet's
      # weights ship committed (no extra step); AdaFace's checkpoint must be
      # downloaded once, see this service's Dockerfile comment.
      TRN_EMBEDDER__BACKEND: adaface
      TRN_LIVENESS__BACKEND: minifasnet
    volumes:
      - ./ai-training:/app
      - ai_training_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ["app"]

  # --- XC-02: infra dasar (default profile, tidak butuh --profile app) ---

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-frac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frac_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-frac}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the `mlflow` DB alongside `frac` and enables pgvector on both
      # (BE-02 owns the real business schema/migrations via alembic).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-frac} -d ${POSTGRES_DB:-frac}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Dev-only fake SMTP server for the forgot-password flow (BE-03 follow-up):
  # backend's SMTP_HOST/SMTP_PORT point here, so every "sent" email is caught
  # and viewable at the web UI instead of leaving the machine. No auth, no
  # persistence needed.
  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"

  # S3-compatible stand-in for dev/CI only. Staging/prod use real AWS S3
  # (see infra/terraform/ — XC-03); ai-training's S3Settings.endpoint_url and
  # MLflow's MLFLOW_S3_ENDPOINT_URL both just point at this instead.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: creates the `mlflow` bucket in MinIO before mlflow/ai-training need it.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password} &&
      mc mb --ignore-existing local/mlflow &&
      mc mb --ignore-existing local/${S3_BUCKET:-frac-media}
      "
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    restart: unless-stopped
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install --no-cache-dir boto3 psycopg2-binary >/tmp/pip-install.log 2>&1 &&
        mlflow server \
          --host 0.0.0.0 --port 5000 \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI:-postgresql://frac:frac_dev_password@postgres:5432/mlflow}" \
          --artifacts-destination "${MLFLOW_ARTIFACT_ROOT:-s3://mlflow/}" \
          --serve-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_password}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
  backend_venv:
  frontend_node_modules:
  ai_inference_venv:
  ai_training_venv:
